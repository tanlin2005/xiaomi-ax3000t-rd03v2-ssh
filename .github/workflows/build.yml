   name: Build CIFS for Linux 4.4.60 ARM

   on:
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - name: Compile in Ubuntu 18.04 Docker (GCC 7.5 + ARM_MODULE_PLTS)
           run: |
             mkdir -p output
             docker run --rm -v $(pwd):/work -w /work ubuntu:18.04 bash -c '
               set -e
               # 1. 更换镜像源并安装工具链
               sed -i -e "s/archive.ubuntu.com/mirrors.kernel.org/g" \
                      -e "s/security.ubuntu.com/mirrors.kernel.org/g" /etc/apt/sources.list
               apt-get update
               apt-get install -y gcc-arm-linux-gnueabihf make xz-utils bc bison flex libssl-dev wget

               # 2. 下载 Linux 4.4.60
               wget -q https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.4.60.tar.xz
               tar -xf linux-4.4.60.tar.xz
               cd linux-4.4.60

               # 3. 配置架构，开启 ARM_MODULE_PLTS 以及匹配小米内核的 SMP/PREEMPT
               make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- defconfig
               ./scripts/config -e SMP
               ./scripts/config -e PREEMPT
               ./scripts/config -e ARM_MODULE_PLTS
               ./scripts/config -m CIFS
               ./scripts/config -m CRYPTO_MD4
               make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

               # 4. 编译模块
               make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- modules_prepare
               make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- fs/cifs/cifs.ko
               make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- crypto/md4.ko

               # 5. 输出编译结果
               cp fs/cifs/cifs.ko /work/output/
               cp crypto/md4.ko /work/output/
               ls -lh /work/output/
             '

         - name: Upload Artifacts
           uses: actions/upload-artifact@v4
           with:
             name: cifs-modules-4.4.60-arm
             path: output/
